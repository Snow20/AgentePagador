<!-- HEADER / NAVBAR -->
<header class="navbar">
  <div class="logo">
    <span class="material-symbols-outlined icon-logo">receipt_long</span>
    <h2>{{ translations[currentLang].title }}</h2>
  </div>
  
  <div class="controls">
    <!-- Botón Cambio de Idioma -->
    <button class="btn-icon" (click)="toggleLanguage()">
      <span class="material-symbols-outlined">language</span>
      <span class="lang-text">{{ currentLang }}</span>
    </button>
  </div>
</header>

<!-- CONTENIDO PRINCIPAL -->
<main class="main-content">
  <p class="subtitle">{{ translations[currentLang].subtitle }}</p>
  
  <app-rules-config [currentLang]="currentLang"></app-rules-config>
  <app-invoice-upload [currentLang]="currentLang"></app-invoice-upload>
  <app-dashboard [currentLang]="currentLang"></app-dashboard>
</main>

<!-- FOOTER -->
<footer class="footer">
  <p>{{ translations[currentLang].footer }}</p>
</footer>

<!-- WIDGET ASISTENTE IA DANI -->
<div class="dani-widget">
  <div class="dani-chatbox" [class.show]="isDaniOpen">
    <div class="dani-header">
      <img src="assets/dani-arcade-cat.png" alt="Dani" class="dani-icon-img">
      <h4>IA Dani</h4>
      <button class="close-btn" (click)="toggleDani()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    
    <div class="dani-body" #chatBody>
      <div *ngFor="let msg of daniMessages" [ngClass]="msg.role === 'user' ? 'msg-user' : 'msg-dani'">
        {{ msg.content }}
      </div>
    </div>

    <!-- Mini-menú de acciones rápidas -->
    <div class="dani-minimenu">
      <button (click)="sendQuickAction('¿Cómo funciona?')">Ayuda</button>
      <button (click)="sendQuickAction('¿Qué significa Rojo?')">Reglas Rojas</button>
      <button (click)="sendQuickAction('¿Qué significa Amarillo?')">Reglas Amarillas</button>
    </div>

    <div class="dani-input">
      <input type="text" #chatInput (keyup.enter)="sendDaniMessage(chatInput)" [placeholder]="translations[currentLang].daniPlaceholder">
      <button class="btn-blinka" (click)="sendDaniMessage(chatInput)">{{ translations[currentLang].daniSend }}</button>
    </div>
  </div>

  <button class="dani-trigger" (click)="toggleDani()" [class.hidden]="isDaniOpen">
    <img src="assets/dani-arcade-cat.png" alt="Dani" class="dani-icon-img trigger-img">
  </button>
</div>
