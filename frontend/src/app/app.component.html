<!-- HEADER / NAVBAR -->
<header class="navbar">
  <div class="logo">
    <span class="material-symbols-outlined icon-logo">receipt_long</span>
    <h2>{{ translations[currentLang].title }}</h2>
  </div>
  
  <div class="controls">
    <!-- Botón Cambio de Idioma -->
    <button class="btn-icon" (click)="toggleLanguage()">
      <span class="material-symbols-outlined">language</span>
      <span class="lang-text">{{ currentLang }}</span>
    </button>
  </div>
</header>

<!-- CONTENIDO PRINCIPAL -->
<main class="main-content">
  <p class="subtitle">{{ translations[currentLang].subtitle }}</p>
  
  <app-rules-config></app-rules-config>
  <app-invoice-upload></app-invoice-upload>
  <app-dashboard></app-dashboard>
</main>

<!-- FOOTER -->
<footer class="footer">
  <p>{{ translations[currentLang].footer }}</p>
</footer>

<!-- WIDGET ASISTENTE IA DANI -->
<div class="dani-widget">
  <div class="dani-chatbox" [class.show]="isDaniOpen">
    <div class="dani-header">
      <span class="material-symbols-outlined">smart_toy</span>
      <h4>IA Dani</h4>
      <button class="close-btn" (click)="toggleDani()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="dani-body">
      <p class="dani-message">{{ translations[currentLang].daniGreeting }}</p>
    </div>
    <div class="dani-input">
      <input type="text" [placeholder]="translations[currentLang].daniPlaceholder">
      <button class="btn-blinka">{{ translations[currentLang].daniSend }}</button>
    </div>
  </div>

  <button class="dani-trigger" (click)="toggleDani()" [class.hidden]="isDaniOpen">
    <span class="material-symbols-outlined">smart_toy</span>
  </button>
</div>
