<header class="app-header">
  <div class="logo-container">
    <span class="material-symbols-outlined logo-icon">receipt_long</span>
    <h1>{{ t.title }}</h1>
  </div>
  <div class="controls">
    <button class="lang-toggle" (click)="toggleLanguage()">
      <span class="material-symbols-outlined">language</span> {{ currentLang }}
    </button>
    <!-- Botón de modo oscuro eliminado -->
  </div>
</header>

<main class="main-content">
  <h2 class="page-subtitle">{{ t.subtitle }}</h2>

  <!-- Sección de Ingesta -->
  <section class="card ingest-card">
    <h3>{{ t.ingestTitle }}</h3>
    <p>{{ t.ingestDesc }}</p>
    
    <div class="file-upload-container">
      <input type="file" (change)="onFileSelected($event)" accept=".pdf,image/*">
    </div>

    <button class="btn-primary" [disabled]="!selectedFile || isLoading" (click)="uploadInvoice()">
      {{ isLoading ? t.processing : t.processBtn }}
    </button>

    <div *ngIf="apiError" class="error-banner">
      {{ t.apiError }}
    </div>
  </section>

  <!-- Panel de Resultados -->
  <section class="card results-card">
    <h3>{{ t.resultsTitle }}</h3>
    <button class="btn-secondary" (click)="loadInvoices()">{{ t.refreshBtn }}</button>
    
    <!-- Mostrar si no hay facturas -->
    <p class="empty-state" *ngIf="invoices.length === 0">{{ t.noInvoices }}</p>

    <!-- Aquí va tu tabla de facturas (ngFor) -->
  </section>
</main>

<footer class="app-footer">
  <p>{{ t.footer }}</p>
</footer>
