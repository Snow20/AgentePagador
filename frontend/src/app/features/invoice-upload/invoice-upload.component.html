<div class="upload-container">
  <h2>{{ t.title }}</h2>
  <p>{{ t.desc }}</p>

  <div class="file-input-group">
    <input type="file" (change)="onFileSelected($event)" accept=".pdf,image/*" class="file-control" id="invoiceFile">
  </div>

  <button (click)="onUpload()" [disabled]="!selectedFile" class="btn-upload">{{ t.processBtn }}</button>

  <div *ngIf="uploadStatus" class="status-box" [ngClass]="{'error': isError}">
    {{ uploadStatus }}
  </div>
</div>
