<div class="upload-container">
  <h2>Ingesta de Facturas</h2>
  <p>Sube la factura (PDF o Imagen) para que el Agente la procese y evalúe las reglas.</p>

  <div class="file-input-group">
    <input type="file" (change)="onFileSelected($event)" accept=".pdf,image/*" class="file-control" id="invoiceFile">
  </div>

  <button (click)="onUpload()" [disabled]="!selectedFile" class="btn-upload">Procesar Factura</button>

  <div *ngIf="uploadStatus" class="status-box" [ngClass]="{'error': uploadStatus.includes('Error')}">
    {{ uploadStatus }}
  </div>
</div>
