<div class="dashboard-container">
  <h2>{{ t.title }}</h2>
  <button (click)="loadDashboard()" class="btn-refresh">{{ t.refreshBtn }}</button>

  <table class="table" *ngIf="invoices.length > 0; else noData">
    <thead>
      <tr>
        <th>{{ t.colFile }}</th>
        <th>{{ t.colStatus }}</th>
        <th>{{ t.colTrafficLight }}</th>
        <th>{{ t.colExplanation }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let inv of invoices">
        <td>{{ inv.fileName }}</td>
        <td>{{ inv.status }}</td>
        <td>
          <span class="badge" [ngClass]="{
            'bg-green': inv.color === 'Verde',
            'bg-yellow': inv.color === 'Amarillo',
            'bg-red': inv.color === 'Rojo',
            'bg-gray': inv.color === 'None'
          }">{{ inv.color }}</span>
        </td>
        <td>{{ inv.explanation }}</td>
      </tr>
    </tbody>
  </table>
  <ng-template #noData>
    <p>{{ t.noInvoices }}</p>
  </ng-template>
</div>
